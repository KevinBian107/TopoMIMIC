# Multiscale Analysis Pipeline Configuration
# Handles split clips (non-500 frame segments)

rodent_rollout_dir: "/home/jovyan/vast/kaiwen/TopoVNL/data/rodent_ar"
behavior_csv: "/home/jovyan/vast/kaiwen/TopoVNL/behavior_book.csv"
output_dir: "out/out_multiscale/analysis"

# Multiscale parameters (must match multiscale.yaml)
multiscale:
  frames_per_clip: 100
  original_num_clips: 500

# Cluster configuration
cluster:
  results_dir: "out/out_multiscale"
  n_clusters: 5
  cluster_labels:
    0: "walk_change_direction"
    1: "groom_change"
    2: "walk_change_speed"
    3: "walk_stop"
    4: "walk_stop"

# MDS subspace analysis parameters
mds_k_cycles: 50
mds_s_top: 10
mds_label_unions:
  - "walk"
  - "rear"
  - "groom"
  - "turn"
  - "stay"

# Axis motion analysis parameters
axis_motion_max_loops: 200

# Pose variance analysis parameters
pose_variance_body_parts:
  - "upper_leg_R"
  - "lower_leg_R"
  - "upper_arm_R"
  - "upper_leg_L"
  - "lower_leg_L"
  - "upper_arm_L"
  - "skull"
  - "torso"
  - "pelvis"
