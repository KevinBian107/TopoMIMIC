# Multiscale DM Latent Subspace Pipeline
# splits clips into smaller segments before clustering

rodent_rollout_dir: "/home/jovyan/vast/kaiwen/TopoVNL/data/rodent_ar"
output_dir: "out/out_multiscale"
num_clips: 500

# Multiscale parameters
multiscale:
  frames_per_clip: 100  # split 500-frame clips into 100-frame segments (5x more clips)

# Discrete Morse parameters
dm:
  pers_delta: 0.75
  k_neighbors: 5
  epsilon: 0.99
  skip: true
  results_dir: "/home/jovyan/vast/kaiwen/TopoVNL/PCD-Graph-Recon-DM/dm_results_m3_tau6_p0.75_f100"

# Clustering parameters
clustering:
  min_len: 0
  max_len: 100
  target_len: 50 # target length changes a lot
  only_max: true
  only_min: false
  skip_clips: []

# Dunn Index cluster selection
auto_cluster:
  enabled: true
  k_min: 5
  k_max: 20
  joint_state_key: "qpos"
  plot_dunn: true
  render_all_k: false
  seed: 0

# Rendering settings
rendering:
  pad: 0
  max_samples: 10
  framerate: 30
  target_size: [320, 240]
