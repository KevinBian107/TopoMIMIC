# Random Seed Benchmark Pipeline
# Runs the same clustering with different random seeds and compares coverage

master_output_dir: "out/out_random_seed_benchmark"
rodent_rollout_dir: "/home/jovyan/vast/kaiwen/TopoVNL/data/rodent_ar"
behavior_csv: "/home/jovyan/vast/kaiwen/TopoVNL/behavior_book.csv"
num_clips: 500

# Discrete-Morse parameters (shared across all seeds)
dm:
  pers_delta: 0.75
  k_neighbors: 5
  epsilon: 0.99
  skip: true
  results_dir: "/home/jovyan/vast/kaiwen/TopoVNL/PCD-Graph-Recon-DM/dm_results_m3_tau6_p0.75"

# Clustering parameters (shared across all seeds)
clustering:
  min_len: 0
  max_len: 500
  target_len: 70
  only_max: true
  only_min: false
  skip_clips: [37, 80, 152, 163, 187, 267, 281, 475, 491]

# Cluster selection parameters
auto_cluster:
  enabled: true
  k_min: 5
  k_max: 20
  joint_state_key: "qpos"
  plot_dunn: true
  render_all_k: false

rendering:
  pad: 0
  max_samples: 10
  framerate: 30
  target_size: [320, 240]

seeds: [123, 456, 789, 1000, 2024, 5678, 9999, 12345]

skip_clustering: true  # true to skip clustering and load existing results
skip_rendering: true   # true to skip video rendering

