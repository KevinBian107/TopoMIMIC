# Discrete Morse Pipeline Configuration
# Run this first to extract DM cycles

output_dir: "out/dm_pipeline_qpos"

data:
  dm_key: "qpos"  # Options: "intention", "qpos", "ekp"
  rodent_rollout_dir: "/home/jovyan/vast/kaiwen/TopoVNL/data/rodent_ar.h5"
  split: "train"
  pca_dims: 10  # Optional PCA pre-reduction before Takens (useful for high-D spaces)
  xml_path: "topo_mimic/dmwk/xml/rodent.xml"  # Required for ekp transform
  stac_data_path: "data/rodent_reference_clips.h5"  # Required for ekp transform

# Takens delay embedding parameters
takens:
  auto_estimate: true  # Set to true to auto-tune via AMI + FNN
  m: 3  # Used when auto_estimate is false
  tau: 6  # Used when auto_estimate is false
  max_tau: 200
  bins: 64
  m_max: 15
  R_tol: 15.0
  A_tol: 2.0
  fnn_thr: 0.05
  theiler: "auto"
  max_points: 20000

# Discrete Morse parameters
dm:
  pers_delta: 0.1
  k_neighbors: 3
  epsilon: 0.99
  skip: false  # Set to true to load existing results
  results_dir: null  # Set path when skip is true

# Video rendering (optional)
rendering:
  enabled: true
  pad: 0
  max_samples: 5
  framerate: 50
  target_size: [320, 240]
