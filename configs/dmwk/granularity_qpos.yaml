output_dir: "outputs/granularity_qpos"

data:
  # dm_key: feature space for DM extraction ("intention" (m3t6), "qpos" (m3t9), or "ekp" (m3t8))
  dm_key: "qpos"
  qpos_key: "qpos"
  rodent_rollout_dir: "/home/jovyan/vast/kaiwen/TopoVNL/data/rodent_ar.h5"
  split: "train"
  # pca_dims: optional PCA reduction (only applies to qpos/ekp, ignored for intention)
  pca_dims: 10
  # xml_path/stac_data_path: required for ekp feature space
  xml_path: "topo_mimic/extraction/xml/rodent.xml"
  stac_data_path: "data/rodent_reference_clips.h5"

takens:
  m: 3
  tau: 9

dm:
  k_neighbors: 3
  epsilon: 0.99
  use_dm_path: true

multi_persistence:
  enabled: true
  pers_delta_values: [0.01, 0.1, 0.15, 0.2, 1.25] #[0.1, 0.25, 0.5, 0.75, 1.0]

joints:
  head_joints: ["atlas", "vertebra_axis_twist"]
  arm_joints: ["elbow_L", "elbow_R", "wrist_L", "wrist_R"]
  root_indices: [0, 1, 2]
  skip_root_dims: 7

stationary:
  enabled: true
  root_displacement_threshold: 0.5

clustering:
  target_len: 100
  only_max: true
  mds_components: 3

redundancy:
  enabled: true
  n_clusters_range: [5, 10, 15, 20, 25]
  dtw_threshold: 0.2 # empirically about this
  dtw_percentile: 10.0
  threshold_method: "fixed"
  top_k_similar_pairs: 5
  max_dtw_comparisons: 100
  cache_clustering: true
  use_cached_clustering: true
  cache_dtw_matrix: true
  use_cached_dtw: true
  seed: 42

rendering:
  enabled: true
  pad: 0
  max_samples: 5
  framerate: 30
  target_size: [320, 240]

plotting:
  figsize: [4.0, 3.5]
  dpi: 300
