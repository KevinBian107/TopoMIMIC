output_dir: "outputs/dm_pipeline_walker_short_intention"

data:
  dataset: "walker_short"
  dm_key: "intention"
  rodent_rollout_dir: "data/walker_short.h5"
  split: "all"
  pca_dims: null
  xml_path: "topo_mimic/dmwk/xml/walker.xml"

takens:
  auto_estimate: true
  m: 3
  tau: 6
  max_tau: 200
  bins: 64
  m_max: 15
  R_tol: 15.0
  A_tol: 2.0
  fnn_thr: 0.05
  theiler: "auto"
  max_points: 20000

dm:
  pers_delta: 0.3
  k_neighbors: 10
  epsilon: 0.99
  use_dm_path: true
  segment_gap_limit: 30
  min_segment_len: 30

rendering:
  enabled: false
