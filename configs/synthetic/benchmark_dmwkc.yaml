# Synthetic Pipeline Configuration
# Applies discrete Morse graph construction and clustering to synthetic data

data_dir: "data/synthetic"
output_dir: "out/out_synthetic"
num_clips: 200

# Takens embedding parameters
takens:
  m: 4
  tau: 3
  auto_estimate: true 
  max_tau: 200
  m_max: 15
  fnn_thr: 0.05

# Discrete Morse graph extraction
dm:
  pers_delta: 0.75 
  k_neighbors: 5  
  epsilon: 0.99 
  skip: false
  results_dir: #"/home/jovyan/vast/kaiwen/TopoVNL/out/out_synthetic/dm_results_m4_tau3_p0.75"

# Clustering parameters
clustering:
  n_clusters: 9
  min_len: 0
  max_len: 500
  target_len: 50
  only_max: true
  only_min: false
  skip_clips: []
