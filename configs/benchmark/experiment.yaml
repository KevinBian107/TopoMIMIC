# Unified Benchmark Experiment Configuration
# Single entry point for all clustering methods

output_dir: "out/benchmark_experiment"
rodent_rollout_dir: "/home/jovyan/vast/kaiwen/TopoVNL/data/rodent_ar.h5"
split: "train"

# Data configuration
data:
  dm_key: "intention"
  evaluation_key: "qpos"

# DM results directory (required - run dm_pipeline first)
dm:
  results_dir: "out/dm_pipeline_ar"

# Window extraction settings
clustering:
  min_len: 0
  max_len: 500
  target_len: 100
  only_max: true
  skip_clips: [80, 187, 267, 392, 456, 491]

# K selection configuration
k_selection:
  n_clusters: 5

# Seeds for reproducibility (multiple seeds for stability analysis)
seeds: [0, 123, 234]
aggregate_seeds: true

# Methods to run
methods:
  - name: "vanilla_kmeans"
    type: "clustering"
    enabled: false

  - name: "pca_kmeans"
    type: "clustering"
    enabled: false
    params:
      n_components: 10

  - name: "umap_kmeans"
    type: "clustering"
    enabled: false
    params:
      n_components: 3
      n_neighbors: 15
      min_dist: 0.1

  - name: "tsne_kmeans"
    type: "clustering"
    enabled: false
    params:
      n_components: 3
      perplexity: 30

  - name: "w2_kmeans"
    type: "clustering"
    enabled: false
    params:
      mds_components: 3

  - name: "gw_kmeans"
    type: "clustering"
    enabled: true
    params:
      mds_components: 3
      loss_fun: "square_loss"
      max_iter: 1000

  - name: "spectral"
    type: "clustering"
    enabled: false
    params:
      affinity: "nearest_neighbors"
      n_neighbors: 10

  - name: "dbscan"
    type: "clustering"
    enabled: false
    params:
      eps: 0.5
      min_samples: 5

  # State-space methods (require keypoint-moseq)
  - name: "arhmm"
    type: "state_space"
    enabled: false
    params:
      latent_dim: 10
      kappa: 10000
      ar_iters: 100

  - name: "slds"
    type: "state_space"
    enabled: false
    params:
      latent_dim: 10
      kappa: 10000
      ar_iters: 50
      full_iters: 50

# Video rendering settings
rendering:
  enabled: true
  pad: 0
  max_samples: 6
  framerate: 50
  target_size: [320, 240]
  per_cluster_videos: false
