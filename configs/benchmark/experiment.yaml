# Unified Benchmark Experiment Configuration
# Single entry point for all clustering methods

output_dir: "out/benchmark_experiment_test"
rodent_rollout_dir: "/home/jovyan/vast/kaiwen/TopoVNL/data/rodent_ar.h5"
split: "test"
n_clips: 100  # Number of clips to use from split (null = all clips in split)

# Data configuration
data:
  dm_key: "intention"
  evaluation_key: "qpos"

# DM results directory (required - run dm_pipeline first)
dm:
  results_dir: "out/dm_pipeline_ar"

# Window extraction settings
clustering:
  min_len: 0
  max_len: 500
  target_len: 100
  only_max: true
  skip_clips: [80, 187, 227, 246, 267, 392, 434, 456, 491, 562, 610, 685]

# K selection configuration
k_selection:
  n_clusters: 10

# Seeds for reproducibility (multiple seeds for stability analysis)
seeds: [0]
aggregate_seeds: true

# Methods to run
methods:
  - name: "w2_dm_kmeans"
    type: "clustering"
    enabled: true
    params:
      mds_components: 3

  - name: "w2_unif_kmeans"
    type: "clustering"
    enabled: train
    params:
      mds_components: 3

  - name: "gw_dm_kmeans"
    type: "clustering"
    enabled: false
    params:
      mds_components: 3
      loss_fun: "square_loss"
      max_iter: 1000

  # State-space method (requires keypoint-moseq)
  # Clusters are defined as transitions between sustained syllables
  # model_type: "arhmm" (AR-HMM only) or "slds" (full SLDS with additional iterations)
  - name: "kpms_intention"
    type: "state_space"
    enabled: false
    params:
      model_type: "arhmm"
      latent_dim: 10
      kappa: 10000
      ar_iters: 100
      full_iters: 300
      min_sustained_duration: 25
      top_k_transitions: 10
      min_instances: 1

# Video rendering settings
rendering:
  enabled: true
  pad: 0
  max_samples: 5
  framerate: 50
  target_size: [320, 240]
  per_cluster_videos: false
