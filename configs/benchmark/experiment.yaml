# Unified Benchmark Experiment Configuration
# Single entry point for all clustering methods

output_dir: "out/benchmark_experiment_train"
rodent_rollout_dir: "/home/jovyan/vast/kaiwen/TopoVNL/data/rodent_ar.h5"
split: "train"
n_clips: null  # Number of clips to use from split (null = all clips in split)

# Data configuration
data:
  dm_key: "intention"
  evaluation_key: "qpos"

# DM results directory (required - run dm_pipeline first)
dm:
  results_dir: "out/dm_pipeline_ar"

# Keypoint configuration (for kpms_keypoint method)
keypoint:
  xml_path: "topo_mimic/dmwk/xml/rodent.xml"
  stac_data_path: "data/rodent_reference_clips.h5"

# Window extraction settings
clustering:
  min_len: 0
  max_len: 500
  target_len: 100
  only_max: true
  skip_clips: [80, 187, 227, 246, 267, 392, 434, 456, 491, 562, 610, 685]

# K selection configuration
k_selection:
  n_clusters: 15

# Seeds for reproducibility (multiple seeds for stability analysis)
seeds: [0]
aggregate_seeds: true

# Methods to run
methods:
  - name: "w2_dm_kmeans"
    type: "clustering"
    enabled: false
    params:
      mds_components: 3

  - name: "w2_unif_kmeans"
    type: "clustering"
    enabled: false
    params:
      mds_components: 3

  - name: "gw_dm_kmeans"
    type: "clustering"
    enabled: false
    params:
      mds_components: 3
      loss_fun: "square_loss"
      max_iter: 1000

  # KPMS Intention Method (tuned hyperparameters from sweep)
  # Best config: kappa=1.35e4, latent_dim=10, num_states=15, model_type=slds
  # Achieves intention reconstruction MSE ~0.57
  - name: "kpms_intention"
    type: "state_space"
    enabled: false
    params:
      model_type: "slds"
      latent_dim: 10
      kappa: 13500
      ar_iters: 100
      full_iters: 300
      min_sustained_duration: 25
      top_k_transitions: 10
      min_instances: 1

  # KPMS Keypoint Method (tuned hyperparameters from sweep)
  # Best config: kappa=1.09e6, latent_dim=15, num_states=10, model_type=arhmm
  # Achieves keypoint reconstruction MSE ~0.002
  - name: "kpms_keypoint"
    type: "state_space"
    enabled: false
    params:
      model_type: "arhmm"
      latent_dim: 15
      kappa: 1090000
      ar_iters: 100
      full_iters: 300
      min_sustained_duration: 25
      top_k_transitions: 10
      min_instances: 1

  # Custom VAE Method (tuned hyperparameters from wandb sweep, run 0etcc386)
  # Best config: latent_dim=30, time_window=30, hidden_dim=512, beta=8.51
  # Achieves intention reconstruction MSE ~2.71e-05
  - name: "custom_vae"
    type: "state_space"
    enabled: true
    params:
      latent_dim: 30
      time_window: 30
      hidden_dim: 512
      beta: 8.51
      learning_rate: 0.000245
      batch_size: 256
      max_epochs: 50
      segmentation_algo: "kmeans"
      min_sustained_duration: 25
      top_k_transitions: 10
      min_instances: 1

# Video rendering settings
rendering:
  enabled: true
  pad: 0
  max_samples: 5
  framerate: 50
  target_size: [320, 240]
  per_cluster_videos: false
