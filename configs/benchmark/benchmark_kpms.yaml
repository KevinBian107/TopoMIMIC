# KPMS Benchmark Configuration
# Benchmarks AR-HMM and SLDS state space models for behavioral clustering

rodent_rollout_dir: "/home/jovyan/vast/kaiwen/TopoVNL/data/rodent_ar"
output_dir: "out_kpms_benchmark"
num_clips: 500
intention_key: "/intention"
joint_state_key: "qpos"

# K sweep range for number of states
k_min: 5
k_max: 20

methods:
  - "arhmm"
  - "slds"

plot_dunn: true
plot_reconstruction: true
recon_clip_idx: 0
recon_n_dims: 3

# Priority: checkpoints > pretrained > train)
# Load from specific checkpoint directories (highest priority)
checkpoints:
  - method: "arhmm"
    checkpoint_dir: "out_kpms_benchmark/arhmm/k5"
    k: 5
  - method: "slds"
    checkpoint_dir: "out_kpms_benchmark/slds/k6"
    k: 6

# Load from pretrained results file
use_pretrained: false
pretrained_results_path: "out_kpms_benchmark/kpms_benchmark_results_full.pkl"

# KPMS model configuration
kpms_config:
  latent_dim: 10
  kappa: 100000.0  # 1e5, sticky parameter for state transitions
  ar_iters: 100     # AR-only training iterations
  full_iters: 100  # Full SLDS training iterations (after AR init)
  seed: 0

# Rendering settings
rendering:
  enabled: true
  pad: 0
  max_samples: 10
  framerate: 30
  target_size: [320, 240]
