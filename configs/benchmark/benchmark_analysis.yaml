# Benchmark Analysis Configuration
# Compares variance differences between labeled behaviors and clustering methods

rodent_rollout_dir: "/home/jovyan/vast/kaiwen/TopoVNL/data/rodent_ar"
behavior_csv: "/home/jovyan/vast/kaiwen/TopoVNL/behavior_book.csv"
output_dir: "out/out_benchmark_analysis"

# Behavior categories to compare
behavior_categories:
  - "walk"
  - "rear"
  - "groom"

# Body parts for variance computation
body_parts:
  - "upper_leg_R"
  - "lower_leg_R"
  - "upper_arm_R"
  - "upper_leg_L"
  - "lower_leg_L"
  - "upper_arm_L"
  - "skull"
  - "torso"
  - "pelvis"

# Maximum loops per cluster for variance computation
max_loops: 200

# Topological comparison settings
topo_samples_per_cluster: 1   # samples per cluster for balanced PH comparison
topo_max_ph_points: 1500      # max total points for persistent homology

# Methods to compare
methods:
  - name: "DM-WKC (Ours)"
    results_dir: "out_subspace_dunn"
    n_clusters: 14
    cluster_labels:
      0: "walk_stay"
      1: "rear_left_turn"
      2: "walk_turn_left"
      3: "rear_left_turn_walk"
      4: "groom"
      5: "groom_right_turn"
      6: "walk_rear"
      7: "rear_right_turn"
      8: "walk_turn"
      9: "rear_face_groom"
      10: "rear_walk_rear"
      11: "walk_stay_walk"
      12: "groom_up_left_turn"
      13: "groom_left_turn"

  - name: "Vanilla KMeans"
    results_dir: "out_benchmark/vanilla_kmeans"
    n_clusters: 16
    cluster_labels:
      0: "groom_right_turn"
      1: "groom"
      2: "groom_left_turn"
      3: "rear_left_turn"
      4: "rear_walk"
      5: "rear_walk"
      6: "walk_stay"
      7: "rear_groom"
      8: "walk_stay"
      9: "walk_stay"
      10: "rear"
      11: "rear_walk"
      12: "rear_right_turn"
      13: "rear_circular_turn"
      14: "walk_turn"
      15: "groom_rear"

  - name: "PCA + KMeans"
    results_dir: "out_benchmark/pca_kmeans"
    n_clusters: 8
    cluster_labels:
      0: "non_det"
      1: "rear_turn_walk"
      2: "walk_turn"
      3: "groom"
      4: "groom_walk"
      5: "rear_walk"
      6: "non_det"
      7: "non_det"

  - name: "t-SNE + KMeans"
    results_dir: "out_benchmark/tsne_kmeans"
    n_clusters: 13
    cluster_labels:
      0: "groom"
      1: "rear_walk"
      2: "rear_groom"
      3: "rear_groom"
      4: "rear_walk"
      5: "rear_groom"
      6: "rear_groom"
      7: "rear_walk"
      8: "rear_walk"
      9: "groom"
      10: "walk"
      11: "walk_turn"
      12: "groom"

  - name: "UMAP + KMeans"
    results_dir: "out_benchmark/umap_kmeans"
