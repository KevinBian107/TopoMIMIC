# Minima Experiment Configuration
# Extracts behavioral minima from DM graphs and state-space methods

dataset: "rodent"
output_dir: "outputs/benchmark_experiment_minima"
data_path: "data/rodent_ar.h5"
behavior_labels_csv: "behavior_labels/rodent_labels.csv"

# DM sources (direct from dm_pipeline output, NOT from experiment_transitions)
dm_sources:
  intention:
    results_dir: "outputs/dm_pipeline_intention"
  qpos:
    results_dir: "outputs/dm_pipeline_qpos"

# State-space methods (loads labels from experiment_transitions output)
state_space_sources:
  kpms_keypoint:
    experiment_dir: "outputs/benchmark_experiment_train"

# Per-clip rendering
per_clip_n: 3
top_k_minima: 4
minima_frame_radius: 10
minima_n_frames: 5
render_target_size: [320, 240]
xml_path: "topo_mimic/extraction/xml/rodent.xml"
camera: "close_profile"

# Clips to skip (same as experiment_transitions)
skip_clips: [80, 187, 227, 246, 267, 322, 392, 434, 456, 491, 562, 610, 685]

# W2 aggregation clustering
n_clusters: 5
n_samples_per_cluster: 5
min_neighborhood_frames: 20
