# Walker Short Benchmark Experiment Configuration
# Auto-labels clusters from GT behavior labels (no manual annotation needed)
# Uses walker_short dataset: 600 clips, 75 frames, 1 transition per clip

dataset: "walker_short"
output_dir: "outputs/benchmark_experiment_transitions_walker"
data_path: "data/walker_short.h5"
split: "all"
n_clips: null
behavior_labels_csv: "behavior_labels/walker_short.csv"

data:
  dm_key: "intention"
  evaluation_key: "qpos"

dm:
  results_dir: "outputs/dm_pipeline_walker_short_intention"

dm_sources:
  intention:
    results_dir: "outputs/dm_pipeline_walker_short_intention"
    dm_key: "intention"
  qpos:
    results_dir: "outputs/dm_pipeline_walker_short_qpos"
    dm_key: "qpos"

keypoint:
  xml_path: "topo_mimic/dmwk/xml/walker.xml"
  stac_data_path: ""

clustering:
  min_len: 30
  max_len: 250
  target_len: 100
  only_max: true
  skip_clips: []

k_selection:
  n_clusters: 25

seeds: [0, 12, 123, 1234, 12345]
aggregate_seeds: true

methods:
  - name: "w2_dmc_int_kmeans"
    type: "clustering"
    dm_source: "intention"
    enabled: true
    params:
      mds_components: 3

  - name: "w2_dmc_qpos_kmeans"
    type: "clustering"
    dm_source: "qpos"
    enabled: true
    params:
      mds_components: 3

  - name: "w2_dmp_int_kmeans"
    type: "clustering"
    dm_source: "intention"
    enabled: true
    params:
      mds_components: 3

  - name: "w2_dmp_qpos_kmeans"
    type: "clustering"
    dm_source: "qpos"
    enabled: true
    params:
      mds_components: 3

  - name: "w2_unif_kmeans"
    type: "clustering"
    dm_source: "intention"
    enabled: true
    params:
      mds_components: 3

  - name: "w2_full_kmeans"
    type: "clustering"
    dm_source: "intention"
    enabled: false
    params:
      mds_components: 3

  - name: "kpms_intention"
    type: "state_space"
    enabled: false
    params:
      model_type: "slds"
      latent_dim: 10
      kappa: 13500
      ar_iters: 100
      full_iters: 300
      min_sustained_duration: 25
      top_k_transitions: 10
      min_instances: 1

  - name: "custom_vae"
    type: "state_space"
    enabled: false
    params:
      latent_dim: 30
      time_window: 30
      hidden_dim: 512
      beta: 8.51
      learning_rate: 0.000245
      batch_size: 256
      max_epochs: 50
      segmentation_algo: "kmeans"
      min_sustained_duration: 25
      top_k_transitions: 10
      min_instances: 1

rendering:
  enabled: false
  pad: 0
  max_samples: 5
  framerate: 50
  target_size: [320, 240]
  per_cluster_videos: false

cluster_merging:
  enabled: true
  threshold_method: "fixed"
  dtw_threshold: 0.2
  dtw_percentile: 10.0
  top_k_similar_pairs: 5
  render_similar_pairs: false
  samples_per_cluster: 3
  skip_root_dims: 7
