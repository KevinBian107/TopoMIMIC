program: topo_mimic/hyperparam_sweep/kpms_sweep.py
method: bayes
metric:
  goal: maximize
  name: eml_intention

parameters:
  kappa:
    distribution: log_uniform_values
    min: 1000
    max: 10000000
  latent_dim:
    values: [5, 10, 15, 20]
  num_states:
    values: [10, 15, 20, 30]
  ar_iters:
    values: [50, 100]
  model_type:
    values: ["arhmm", "slds"]

early_terminate:
  type: hyperband
  min_iter: 3
  max_iter: 20

command:
  - ${env}
  - python
  - ${program}
  - --config
  - configs/benchmark/hyperparam_sweep/kpms_sweep.yaml
  - --sweep
