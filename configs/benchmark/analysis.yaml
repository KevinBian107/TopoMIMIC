# Unified Analysis Configuration
# Run after experiment.py to analyze results

experiment_dir: "out/benchmark_experiment"
output_dir: "out/benchmark_analysis"

rodent_rollout_dir: "/home/jovyan/vast/kaiwen/TopoVNL/data/rodent_ar.h5"
behavior_csv: "/home/jovyan/vast/kaiwen/TopoVNL/behavior_book.csv"
behavior_labels_csv: "/home/jovyan/vast/kaiwen/TopoVNL/behavior_labels.csv"

# Filter to specific methods and seeds (null = all)
# Example: methods: ["gw_kmeans", "w2_kmeans"]
# Example: seeds: [0, 123]
methods: ["w2_kmeans", "w2_kmeans_baseline"]
seeds: [0]

# Analysis modules to run
run_variance_heatmap: false
run_mds_analysis: false
run_cluster_to_label_comparison: false
run_seed_comparison: false  # Side-by-side plots across seeds
run_transition_comparison: true  # Side-by-side discovered vs ground truth transitions
run_javd_analysis: true  # Joint Angle Variance Difference analysis
render_gt_transitions: false  # Render GT transition videos in grid format

# JAVD settings
top_k_variance_joints: 5  # Number of top variance joints per cluster to include
gt_render_max_samples: 5  # Max samples per transition for video rendering
gt_render_framerate: 30  # Framerate for GT transition videos
gt_render_target_size: [320, 240]  # Target tile size for GT rendering

# MDS settings
mds_k_cycles: 50
mds_s_top: 10
mds_figsize: [10, 9]  # [width, height]
# Behaviors to show separately in MDS (null = all behaviors from behavior_labels_csv)
# Available: Walking, Immobility, Grooming, Orienting, Supported Rear, Unsupported Rear, Left Turn, Right Turn
mds_behaviors: null

# Body parts for variance analysis
body_parts:
  - "torso"
  - "pelvis"
  - "upper_leg_L"
  - "lower_leg_L"
  - "foot_L"
  - "upper_leg_R"
  - "lower_leg_R"
  - "foot_R"
  - "skull"
  - "jaw"
  - "upper_arm_L"
  - "lower_arm_L"
  - "upper_arm_R"
  - "lower_arm_R"

max_loops: 200

# Transition comparison settings
max_transition_points: 500  # Max points to display per cluster

# New transition analysis settings
short_behavior_threshold: 10  # Max frames for intermediate behavior to be bridged (e.g., rear->walk->orienting(8 frames)->walk becomes rear->walk)
max_gap_between_segments: 10  # Max gap between consecutive behavior segments to count as transition
merge_rear: true  # Merge Supported Rear and Unsupported Rear into single "Rear" category
run_transition_ranking: true  # Generate transition variant rankings (with turn directions)
