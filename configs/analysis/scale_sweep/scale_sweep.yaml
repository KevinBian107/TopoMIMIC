io:
  output_dir: outputs/analysis/scale_sweep/v1
  log_level: info
  save_checkpoints: true

data:
  dataset: rodent
  rodent_rollout_dir: data/rodent_ar.h5
  behavior_labels_csv: behavior_labels/rodent_labels.csv
  start_clip: 642
  end_clip: 842   # original test-split range; Mapper fit_transform on 842 clips materializes a 400k-point cover that hangs in tdamapper. 200 clips produces ~99k points which fits the original scale_sweep compute envelope.
  xml_path: topo_mimic/extraction/xml/rodent.xml
  stac_data_path: data/rodent_reference_clips.h5
  respect_skip_clips: true

kpms:
  enabled: true
  kappa_grid: [1.0e+3, 1.0e+4, 1.0e+5, 1.0e+6, 1.0e+7]
  num_states_grid: [5, 10, 15, 20, 30]
  seeds: [0]
  ar_iters: 50
  full_iters: 300
  latent_dim: 10
  model_type: arhmm
  selection:
    criterion: eml
    min_usage_ratio: 0.8

mapper:
  enabled: true
  feature_spaces: [intention, qpos, ekp]
  lens_grid:
    - {name: knn_density, params: {knn_k: 3}}
    - {name: pca_1d, params: {}}
    - {name: eccentricity, params: {knn_k: 3}}
  n_intervals_grid: [5, 10, 15, 20, 25]
  overlap_frac: 0.5
  dbscan_eps: auto
  dbscan_min_samples: 5
  takens_per_feature_space:
    intention: {m: 3, tau: 6}
    qpos: {m: 3, tau: 9}
    ekp: {m: 3, tau: 8}
  min_total_frames: 500

discovery:
  min_member_clips: 3
  min_majority_fraction: 0.50
  min_total_frames: 500
  second_behavior_threshold: 0.20
  groom_singleton: true
  dm_wkc_reference_path: null

visualization:
  discovery_eyeball_png: true
  trace_png:
    enabled: true
    n_exemplar_clips: 5
