# Attractor Analysis Pipeline Configuration
# Clusters no-cycle clips using W2 distance + MDS + KMeans with Dunn Index optimization

# Path to DM results directory containing all_cycle_dm.pkl
dm_results_dir: "/home/jovyan/vast/kaiwen/TopoVNL/PCD-Graph-Recon-DM/dm_results_m3_tau6_p0.75"

rodent_rollout_dir: "/home/jovyan/vast/kaiwen/TopoVNL/data/rodent_ar"
output_dir: "out_attractor"
num_clips: 500

# Joint state key for Dunn Index computation
joint_state_key: "qpos"

# W2 + MDS + KMeans clustering parameters
clustering:
  k_min: 2
  k_max: 20
  random_state: 6
  subsample_frames: 50 # Randomly subsample frames per clip for W2 (null = use all 499 frames)
  mds_components: 2 # MDS embedding dimensions before KMeans
  skip_clips: [37, 80, 152, 163, 187, 227, 246, 267, 281, 322, 434, 475, 491]

  cluster_labels:
    0: "groom"
    1: "rear"

# Behavior coverage comparison
coverage:
  behavior_csv: "/home/jovyan/vast/kaiwen/TopoVNL/behavior_book.csv"
  behavior_categories:
    - "walk"
    - "rear"
    - "groom"
  max_clips_per_behavior: 50

# Rendering settings
rendering:
  max_samples: 10
  framerate: 30
  target_size: [320, 240]
