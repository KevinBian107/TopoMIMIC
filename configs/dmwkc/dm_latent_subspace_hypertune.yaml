# DM Latent Subspace Hyperparameter Tuning Configuration

rodent_rollout_dir: "/home/jovyan/vast/kaiwen/TopoVNL/data/latest_rodent.h5"
output_dir: "dm_tuning_auto"

num_clips_total: 642
num_clips_eval: 10

# Takens parameters - set auto_estimate: true to compute via AMI+FNN
takens:
  auto_estimate: true
  m: 3          # fallback if auto_estimate fails
  tau: 5        # fallback if auto_estimate fails
  # AMI parameters
  max_tau: 200
  bins: 64
  # FNN parameters
  m_max: 15
  R_tol: 15.0
  A_tol: 2.0
  fnn_thr: 0.05
  theiler: "auto"
  max_points: 20000

# DM parameters to tune
dm:
  epsilon: 0.99

# Parameter grid for tuning
param_grid:
  k_neighbors: [3, 5, 7]
  pers_delta: [0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]

# Scoring weights for composite metric
scoring:
  cycle_coverage_weight: 0.3
  num_cycles_weight: 0.2
  connectivity_weight: 0.2
  mean_cycle_length_weight: 0.15
  cycle_length_std_weight: 0.15

# Rendering settings
visualization:
  save_plots: true
  plot_by_k: true
  plot_by_clip: true
  save_ami_fnn_plot: true
