# Takens embedding parameters
takens:
  m: 3
  tau: 5

# Discrete Morse parameters
dm:
  pers_delta: 0.75
  k_neighbors: 5
  epsilon: 0.99
  skip: false
  results_dir: null #"/home/jovyan/vast/kaiwen/TopoVNL/PCD-Graph-Recon-DM/dm_results_m3_tau6_p0.75_f500"

