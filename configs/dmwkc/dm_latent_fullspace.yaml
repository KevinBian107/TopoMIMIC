# DM Latent Fullspace Pipeline Configuration
# Performs DM graph on pooled loop intentions from per-clip DM analysis

rodent_rollout_dir: "/home/jovyan/vast/kaiwen/TopoVNL/data/rodent_ar"
output_dir: "out/out_fullspace"

# Takens embedding parameters
takens:
  m: 3
  tau: 6

# Per-clip DM parameters (load from DM results)
per_clip_dm:
  results_dir: "/home/jovyan/vast/kaiwen/TopoVNL/PCD-Graph-Recon-DM/dm_results_m3_tau6_p0.75_f500"
  loop_select: "shortest"  # "shortest" or "longest"
  target_len: 10  # downsample each loop to this length
  min_len: 0
  max_len: 500

# Pooled DM parameters
pooled_dm:
  pers_delta: 0.75
  k_neighbors: 5
  epsilon: 0.99

# Rendering settings
rendering:
  framerate: 30
  target_size: [640, 480]
  pca_size: [400, 400]
  show_skeleton: true
  show_progression: true
