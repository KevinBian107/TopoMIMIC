# DM Latent Subspace Pipeline with Dunn Index Cluster Selection
# Higher Dunn = min(inter-cluster dist) / max(intra-cluster diameter)
# Maximizes distinct, well-separated clusters

rodent_rollout_dir: "/home/jovyan/vast/kaiwen/TopoVNL/data/latest_rodent.h5"
output_dir: "out/out_subspace_dunn"
num_clips: 642

# Takens embedding parameters
takens:
  m: 3
  tau: 5

# Discrete Morse parameters
dm:
  pers_delta: 0.75
  k_neighbors: 5
  epsilon: 0.99
  skip: false
  results_dir: null

# Clustering parameters
clustering:
  min_len: 0
  max_len: 500
  target_len: 70
  only_max: true
  only_min: false
  skip_clips: []

# Dunn Index cluster selection
auto_cluster:
  enabled: true
  k_min: 5
  k_max: 20
  joint_state_key: "qpos"  # key in h5 file for joint space (used for clustering)
  plot_dunn: true  # save Dunn Index analysis plots
  render_all_k: false  # render video for each k value evaluated
  seed: 0

# Rendering settings
rendering:
  pad: 0
  max_samples: 10
  framerate: 30
  target_size: [320, 240]
