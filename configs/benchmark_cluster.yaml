# Benchmark Clustering Pipeline Configuration
# Compares multiple clustering methods with Dunn-based k selection

# Data paths
rodent_rollout_dir: "/home/jovyan/vast/kaiwen/TopoVNL/data/rodent_ar"
output_dir: "out_benchmark"

# Number of clips to use
num_clips: 500

# DM results (precomputed cycles)
dm:
  results_dir: "/home/jovyan/vast/kaiwen/TopoVNL/PCD-Graph-Recon-DM/dm_results_m3_tau6_p0.75"

# Cycle filtering
clustering:
  min_len: 0
  max_len: 500
  target_len: 70
  only_max: true
  only_min: false
  skip_clips: [37, 152, 163, 274, 281]

# Dunn index cluster selection (shared across all methods)
auto_cluster:
  k_min: 2
  k_max: 20
  joint_state_key: "qpos"
  plot_dunn: true

# Methods to benchmark
methods:
  - name: "vanilla_kmeans"
    enabled: true
    params: {}

  - name: "pca_kmeans"
    enabled: true
    params:
      n_components: 10

  - name: "tsne_kmeans"
    enabled: true
    params:
      n_components: 3
      perplexity: 30

  - name: "umap_kmeans"
    enabled: true
    params:
      n_components: 3
      n_neighbors: 15
      min_dist: 0.1

  - name: "dbscan"
    enabled: true
    params:
      # eps_range auto-estimated from data if not provided
      min_samples: 5

  - name: "spectral"
    enabled: true
    params:
      n_neighbors: 10
      affinity: "nearest_neighbors"

# Rendering parameters
rendering:
  pad: 0
  max_samples: 5
  framerate: 30
  target_size: [320, 240]
