# Benchmark Analysis Configuration
# Compares variance differences between labeled behaviors and clustering methods

# Data paths
rodent_rollout_dir: "/home/jovyan/vast/kaiwen/TopoVNL/data/rodent_ar"
behavior_csv: "/home/jovyan/vast/kaiwen/TopoVNL/behavior_book.csv"
output_dir: "out_benchmark_analysis"

# Behavior categories to compare
behavior_categories:
  - "walk"
  - "rear"
  - "groom"

# Body parts for variance computation
body_parts:
  - "upper_leg_R"
  - "lower_leg_R"
  - "upper_arm_R"
  - "upper_leg_L"
  - "lower_leg_L"
  - "upper_arm_L"
  - "skull"
  - "torso"
  - "pelvis"

# Maximum loops per cluster for variance computation
max_loops: 200

# Methods to compare (each method has its own cluster results)
methods:
  # Our TDA method (reference)
  - name: "TDA (Ours)"
    results_dir: "out_subspace_dunn"
    n_clusters: 14
    cluster_labels:
      0: "walk_stay"
      1: "rear_left_turn"
      2: "walk_turn"
      3: "rear_left_turn_walk"
      4: "groom"
      5: "groom_right_turn"
      6: "walk_rear"
      7: "rear_right_turn"
      8: "walk_turn"
      9: "rear_face_groom"
      10: "rear_walk_rear"
      11: "walk_stay_walk"
      12: "groom_up_left_turn"
      13: "groom_left_turn"

