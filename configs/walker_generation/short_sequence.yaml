# Walker short-sequence generation: 600 clips, 250 frames, 1 transition each
# Transition-dominant: ~150 frames transition, ~50 frames per behavior
# For DM clustering benchmark (not demos)

long_sequence:
  n_clips: 600
  clip_length: 250
  n_transitions: 1
  source_pool:
    - walk_slow
    - walk_backward
  target_pool:
    - hop
    - tiptoe
  transition_length: 150
  variable_transition_length: true
  transition_length_min: 120
  transition_length_max: 180

checkpoints:
  step1_path: data/checkpoints/walker_multi_behavior/260215_202424
  step2_path: data/checkpoints/walker_imitation/260224_030923

schedule:
  rollout_frames: 500
  warmup_frames: 200
  warmup_transition_frames: 50
  mode_duration_min: 20
  mode_duration_extra_max: 10
  transition_mean: 150
  transition_std: 20

rollout:
  batch_size: 50
  extraction_batch_size: 50
  seed: 0

output:
  h5_path: data/walker_short.h5
  csv_path: behavior_labels/walker_short.csv
