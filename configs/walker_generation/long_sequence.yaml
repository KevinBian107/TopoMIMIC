mode: long_sequence

long_sequence:
  n_clips: 20
  clip_length: 1000
  n_transitions: 10
  source_pool:
    - walk_slow
    - run
    - walk_fast
    - walk_backward
  target_pool:
    - hop
    - knee_down
    - tiptoe
    - stand
  transition_length: 50
  variable_transition_length: true
  transition_length_min: 30
  transition_length_max: 70

checkpoints:
  step1_path: data/checkpoints/walker_multi_behavior/260215_202424
  step2_path: data/checkpoints/walker_imitation/260224_030923

schedule:
  rollout_frames: 1500
  warmup_frames: 200
  warmup_transition_frames: 50
  mode_duration_min: 250
  mode_duration_extra_max: 100
  transition_mean: 100
  transition_std: 20

rollout:
  batch_size: 10
  extraction_batch_size: 5
  seed: 0

output:
  h5_path: data/walker_long.h5
  csv_path: walker_long_behavior_labels.csv
  demo_clip_video: outputs/walker_long_demo/demo_clip.mp4
