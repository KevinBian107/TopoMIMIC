dataset: rodent
output_dir: outputs/experiment/transitions
data_path: data/rodent_ar.h5
behavior_labels_csv: behavior_labels/rodent_labels.csv
split: all
n_clips: null
data:
  dm_key: intention
  evaluation_key: qpos
dm:
  results_dir: outputs/extraction/dm_pipeline_intention
dm_sources:
  intention:
    results_dir: outputs/extraction/dm_pipeline_intention
    dm_key: intention
  qpos:
    results_dir: outputs/extraction/dm_pipeline_qpos
    dm_key: qpos
  ekp:
    results_dir: outputs/extraction/dm_pipeline_ekp
    dm_key: ekp
keypoint:
  xml_path: topo_mimic/extraction/xml/rodent.xml
  stac_data_path: data/rodent_reference_clips.h5
clustering:
  min_len: 0
  max_len: 500
  target_len: 100
  only_max: true
  skip_clips:
  - 80
  - 187
  - 227
  - 246
  - 267
  - 392
  - 434
  - 456
  - 475
  - 491
  - 562
  - 610
  - 685
k_selection:
  n_clusters: 25
seeds:
- 0
- 1
- 2
aggregate_seeds: true
methods:
- name: w2_dmc_int_kmeans
  type: clustering
  dm_source: intention
  enabled: false
  params:
    mds_components: 3
- name: w2_dmc_qpos_kmeans
  type: clustering
  dm_source: qpos
  enabled: false
  params:
    mds_components: 3
- name: w2_dmc_ekp_kmeans
  type: clustering
  dm_source: ekp
  enabled: false
  params:
    mds_components: 3
- name: w2_dmp_int_kmeans
  type: clustering
  dm_source: intention
  enabled: true
  params:
    mds_components: 3
- name: w2_dmp_qpos_kmeans
  type: clustering
  dm_source: qpos
  enabled: true
  params:
    mds_components: 3
- name: w2_dmp_ekp_kmeans
  type: clustering
  dm_source: ekp
  enabled: true
  params:
    mds_components: 3
- name: w2_unif_kmeans
  type: clustering
  dm_source: intention
  enabled: false
  params:
    mds_components: 3
- name: w2_full_kmeans
  type: clustering
  dm_source: intention
  enabled: false
  params:
    mds_components: 3
- name: gw_dmc_int_kmeans
  type: clustering
  dm_source: intention
  enabled: false
  params:
    mds_components: 3
    loss_fun: square_loss
    max_iter: 1000
- name: kpms_intention
  type: state_space
  enabled: false
  params:
    model_type: slds
    latent_dim: 10
    kappa: 13500
    ar_iters: 100
    full_iters: 300
    min_sustained_duration: 25
    top_k_transitions: 10
    min_instances: 1
- name: kpms_keypoint
  type: state_space
  enabled: false
  params:
    model_type: arhmm
    latent_dim: 15
    kappa: 1090000
    ar_iters: 100
    full_iters: 300
    min_sustained_duration: 25
    top_k_transitions: 10
    min_instances: 1
- name: custom_vae
  type: state_space
  enabled: false
  params:
    latent_dim: 30
    time_window: 30
    hidden_dim: 512
    beta: 8.51
    learning_rate: 0.000245
    batch_size: 256
    max_epochs: 50
    segmentation_algo: kmeans
    min_sustained_duration: 25
    top_k_transitions: 10
    min_instances: 1
- name: mapper_int
  type: state_space
  enabled: false
  params:
    takens_m: 3
    takens_tau: 6
    knn_k: 3
    n_intervals: 10
    overlap_frac: 0.5
    dbscan_min_samples: 5
    min_total_frames: 0
- name: mapper_qpos
  type: state_space
  enabled: false
  params:
    takens_m: 3
    takens_tau: 9
    knn_k: 3
    n_intervals: 10
    overlap_frac: 0.5
    dbscan_min_samples: 5
    min_total_frames: 0
- name: mapper_ekp
  type: state_space
  enabled: false
  params:
    takens_m: 3
    takens_tau: 8
    knn_k: 3
    n_intervals: 10
    overlap_frac: 0.5
    dbscan_min_samples: 5
    min_total_frames: 0
rendering:
  enabled: false
  pad: 0
  max_samples: 5
  framerate: 50
  target_size:
  - 320
  - 240
  per_cluster_videos: false
cluster_merging:
  enabled: false
  threshold_method: fixed
  dtw_threshold: 0.2
  dtw_percentile: 10.0
  top_k_similar_pairs: 5
  render_similar_pairs: true
  samples_per_cluster: 3
  skip_root_dims: 7
