output_dir: "outputs/hyperparam_sweep"

data:
  rodent_rollout_dir: "data/rodent_ar.h5"
  train_clips: [0, 642]
  test_clips: [642, 742]

keypoint:
  xml_path: "topo_mimic/extraction/xml/rodent.xml"
  stac_data_path: "data/rodent_reference_clips.h5"

hyperparams:
  kappa: 100000
  latent_dim: 10
  num_states: 20
  ar_iters: 50
  full_iters: 300
  model_type: "arhmm"

wandb:
  project: "topomimic-benchmark-sweep"
  entity: null
  enabled: true
  n_video_samples: 2

evaluation:
  n_models_per_setting: 5
  seeds: [0, 1, 2, 3, 4]

rendering:
  enabled: true
  fps: 30
  target_size: [320, 240]
  camera_name: "close_profile"
