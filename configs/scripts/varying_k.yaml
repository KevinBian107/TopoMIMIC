# Varying K Experiment Configuration
# Tests DM-G behavior on moving vs stationary clips across different k values

output_dir: "outputs/varying_k"

data:
  rodent_rollout_dir: "/home/jovyan/vast/kaiwen/TopoVNL/data/rodent_ar.h5"
  split: "train"
  intention_key: "intention"
  qpos_key: "qpos_rollout"
  skip_clips: [80, 187, 227, 246, 267, 392, 434, 456, 491, 562, 610, 685]

clip_selection:
  # Minimum root displacement to consider a clip as "moving"
  min_displacement: 0.5
  seed: 42
  # Optionally specify clip IDs directly (leave empty to auto-select)
  moving_clip_id: null
  stationary_clip_id: null

dm:
  # Takens embedding parameters
  m: 3
  tau: 6
  # K values to test
  k_values: [3, 5, 7, 10, 15, 20]
  # Persistence threshold
  pers_delta: 0.9
  epsilon: 0.99

rendering:
  framerate: 30
  target_size: [320, 240]
  camera_name: "close_profile"
