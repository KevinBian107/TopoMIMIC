output_dir: outputs/complexity_arrow
output_format: pdf
dpi: 300
target_strip_height: 400
gap_fraction: 0.3
walker_label: "Generated, labeled\nmulti-transition walker"
rodent_label: "Imitated, unlabeled\nmulti-transition rodent"

filmstrip:
  n_poses: 5
  camera_elevation: -35.0
  camera_azimuth: 90.0
  camera_distance_margin: 2.5
  render_height: 720
  render_width: 960

walker:
  dataset: walker_long
  clip_id: 0
  n_frames: 500
  sample_every: 100
  rollout_path: data/walker_long.h5
  xml_path: topo_mimic/dmwk/xml/walker.xml

rodent_panels:
  - dataset: rodent
    clip_id: 650
    n_frames: 500
    sample_every: 100
    rollout_path: data/rodent_ar.h5
    xml_path: topo_mimic/dmwk/xml/rodent.xml
