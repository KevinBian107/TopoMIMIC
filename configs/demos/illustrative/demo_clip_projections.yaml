# Clip-level projection comparison (real clip vs DM path/cycle as one point).
# Produces 6 figures: (DMC, DMP) x (PCA, UMAP, t-SNE). Each figure is
# 2 rows (real clips, DM members) x 3 cols (intention, qpos, ekp).

h5_path: "data/rodent_ar.h5"
behavior_labels_csv: "behavior_labels/rodent_labels.csv"
experiment_dir: "outputs/benchmark_experiment_transitions"
xml_path: "topo_mimic/extraction/xml/rodent.xml"
stac_data_path: "data/rodent_reference_clips.h5"

seed: 0
window_frames: 100
dm_resample_k: 100

feature_spaces: ["intention", "qpos", "ekp"]
dm_methods: ["dmc", "dmp"]
projections: ["pca", "umap", "tsne"]

point_size_clip: 18.0
point_size_dm: 8.0

output_dir: "outputs/demos/clip_level_projections"
