dataset: rodent
data_path: data/rodent_ar.h5
labels_csv: behavior_labels/rodent.csv
xml_path: topo_mimic/dmwk/xml/rodent.xml
stac_data_path: data/rodent_reference_clips.h5

output_dir: outputs/global_manifold/rodent
cache_dir: outputs/global_manifold/rodent/cache

transition_types:
  - [Rear, Walking]
  - [Orienting, Walking]
  - [Immobility, Walking]

feature_spaces:
  - dm_key: intention
    pca_dims: null
    pers_delta: 0.1
    subsample:
      method: dbscan
      dense_downsample_frac: 0.99
      noise_downsample_frac: 0.9
      dbscan_eps: null
      dbscan_min_samples: 10
    takens:
      auto_estimate: true
      m: 3
      tau: 6
  - dm_key: qpos
    pca_dims: 10
    pers_delta: 0.03
    subsample:
      method: dbscan
      dense_downsample_frac: 0.99
      noise_downsample_frac: 0.9
      dbscan_eps: null
      dbscan_min_samples: 10
    takens:
      auto_estimate: true
      m: 3
      tau: 9
  - dm_key: ekp
    pca_dims: 10
    pers_delta: 0.02
    subsample:
      method: dbscan
      dense_downsample_frac: 0.99
      noise_downsample_frac: 0.9
      dbscan_eps: null
      dbscan_min_samples: 10
    takens:
      auto_estimate: true
      m: 3
      tau: 8

dm:
  k_neighbors: 12
  epsilon: 0.99

minima_selection:
  primitives: [Rear, Walking, Orienting, Immobility]
  neighbor_votes: 15
  candidate_pool: 50

path_sampling:
  k_per_pair: 5
  simple_path_cap: 200
  gap_limit: 50
  min_segment_len: 2
  rng_seed: 0

projection:
  methods: [pca, tsne, umap]
  tsne_perplexity: 30
  umap_n_neighbors: 15
  umap_min_dist: 0.1
  max_points: 20000
  rng_seed: 0

visualization:
  dpi: 300
  background_alpha: 0.12
  background_size: 4
  overlay_linewidth: 1.4
  minima_marker_size: 140
  filmstrip_n_poses: 5
  behavior_colors:
    Rear:       "#E64B35"
    Walking:    "#4DBBD5"
    Orienting:  "#00A087"
    Immobility: "#3C5488"
  turn_shapes:
    straight: o
    left:     s
    right:    D
