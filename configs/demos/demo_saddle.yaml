# Saddle Surface DM-G Demonstration Configuration
# Demonstrates discrete Morse graph cycle detection on paths over a saddle surface
#
# Three experiments:
# 1. Path crossing between two local minima (detects topological loop)
# 2. Path staying within one basin (no loop detected)
# 3. Combined paths from experiments 1 and 2 (same seeds for reproducibility)

output_dir: "out/saddle_dm_demo"

surface:
  x_range: [-2.5, 2.5]
  y_range: [-2.5, 2.5]
  resolution: 100

path:
  n_steps: 500
  noise_std: 0.01
  seed: 42
  # Basin path parameters
  basin_radius: 0.2
  basin_step_size: 0.03
  basin_attraction: 0.1

dm:
  k_neighbors: 7
  pers_delta: 0.1
  epsilon: 0.99

visualization:
  # Figure settings
  summary_figsize: [18, 6]
  individual_figsize: [14, 6]
  dpi: 150
  # View angles for 3D plots
  perspective_elev: 35
  perspective_azim: 45
  topdown_elev: 90
  topdown_azim: 0
  # Surface appearance
  surface_alpha: 0.35
  contour_levels: 15
  contour_alpha: 0.4
  # Path appearance
  path_linewidth: 2.5
  path_alpha: 0.9
  density_k: 15
  density_cmap: "plasma"
  # Cycle highlight appearance
  cycle_color: "lime"
  cycle_edge_color: "darkgreen"
  cycle_marker_size: 80
  cycle_linewidth: 5.0
  # Critical point markers
  minima_color: "blue"
  minima_marker: "v"
  minima_size: 120
  maxima_color: "red"
  maxima_marker: "^"
  maxima_size: 120
  saddle_color: "orange"
  saddle_marker: "s"
  saddle_size: 100
