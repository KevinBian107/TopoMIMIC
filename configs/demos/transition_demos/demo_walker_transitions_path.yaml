dataset: walker_long
data_path: data/walker_long.h5
labels_csv: behavior_labels/walker_long.csv
output_dir: outputs/walker_transitions

visualization:
  subsample_stride: 5
  window_size: 70
  window_stride: 10

dm_pipeline:
  dm_key: intention
  split: all
  top_k_minima: 15
  top_k_paths: 1
  takens:
    auto_estimate: true
  dm:
    pers_delta: 0.3
    k_neighbors: 8
    min_segment_len: 10

rendering:
  enabled: false
  pca_debug: false
  walker_xml: topo_mimic/dmwk/xml/walker.xml
  max_clips: 10
  max_segments: 10
  max_debug_clips: 10
  top_k_debug_paths: 3
  framerate: 30
  target_size: [320, 240]

transition_analysis:
  enabled: true
  top_k_paths: 3
  min_segment_len: 10

skeleton_analysis:
  enabled: true
  n_minima: 8
  k_paths: 1
  umap_n_neighbors: 15
  umap_min_dist: 0.1
  render_minima: true
  minima_n_frames: 5
  minima_frame_radius: 10
  frechet_enabled: true
  target_size: [320, 240]

