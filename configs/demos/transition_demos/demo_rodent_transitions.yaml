dataset: rodent
data_path: data/rodent_ar.h5
labels_csv: behavior_labels.csv
dm_key: intention
output_dir: outputs/rodent_transitions

window_size: 100
min_transition_frames: 20
short_threshold: 10
max_gap: 10
top_k: 10
bootstrap_n: 1200

dm_pipeline:
  enabled: true
  dm_key: intention
  min_segment_len: 5
  takens:
    auto_estimate: true
  dm:
    pers_delta: 1.0
    k_neighbors: 3
    use_dm_path: true

rendering:
  enabled: true
  xml_path: topo_mimic/dmwk/xml/rodent.xml
  max_samples: 5
  framerate: 30
  target_size: [640, 480]

skeleton_analysis:
  enabled: true
  n_minima: 8
  k_paths: 1
  umap_n_neighbors: 15
  umap_min_dist: 0.1
  render_minima: true
  minima_n_frames: 5
  minima_frame_radius: 10
  frechet_enabled: true
  target_size: [640, 480]
