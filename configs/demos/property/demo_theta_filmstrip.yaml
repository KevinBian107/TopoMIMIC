output_dir: "outputs/theta_filmstrip"
data:
  rodent_rollout_dir: "data/rodent_ar.h5"
  xml_path: "topo_mimic/dmwk/xml/rodent.xml"
  stac_data_path: "data/rodent_reference_clips.h5"
feature_spaces:
  - dm_key: intention
    takens_m: 3
    takens_tau: 6
    pers_delta: 0.75
clip_ids: []
clip_discovery:
  enabled: true
  top_k: 50
dm:
  k_neighbors: 3
  epsilon: 0.99
visualization:
  dpi: 150
  segment_gap_limit: 10
filmstrip:
  n_poses: 5
  camera_elevation: -55
  camera_azimuth: 90
  camera_distance_margin: 2.5
  render_height: 720
  render_width: 1280
  similarity_threshold: 0.5
  gap_threshold: 10
  min_segment_length: 30
